name: Bug report
description: Report a reproducible problem with the application or developer workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the project. Do not include private student data, sensitive documents, or unlicensed font files.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    attributes:
      label: Application surface
      options:
        - Web development application
        - Windows desktop application
        - macOS desktop application
        - PDF or printing
        - Development or build tooling
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
  - type: input
    attributes:
      label: Operating system and browser
      placeholder: Windows 11 24H2, desktop app; or macOS 15, Safari 18
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or sample text if useful.
